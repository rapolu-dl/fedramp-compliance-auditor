name: Deploy Lambda

on:
  push:
    branches:
      - main
    paths:
      - "compliance_agent.py"
      - "lambda_function.py"
      - "nist_full_catalog.json"
      - "nist_catalog_metadata.json"
      - "requirements-lambda.txt"
      - ".github/workflows/deploy-lambda.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-fedramp-compliance-lambda
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$AWS_REGION" || {
            echo "Missing repository variable AWS_REGION"
            exit 1
          }

          test -n "$LAMBDA_FUNCTION_NAME" || {
            echo "Missing repository variable LAMBDA_FUNCTION_NAME"
            exit 1
          }

          test -n "$AWS_ROLE_ARN" || {
            echo "Missing repository variable AWS_ROLE_ARN"
            exit 1
          }

          test -f compliance_agent.py
          test -f lambda_function.py
          test -f nist_full_catalog.json
          test -f nist_catalog_metadata.json
          test -f requirements-lambda.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-lambda.txt

      - name: Syntax check
        shell: bash
        run: |
          python -m py_compile compliance_agent.py lambda_function.py

      - name: Build Lambda ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build lambda-deployment.zip
          mkdir -p build

          python -m pip install --upgrade pip
          python -m pip install \
            --requirement requirements-lambda.txt \
            --target build \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all:

          cp compliance_agent.py build/
          cp lambda_function.py build/
          cp nist_full_catalog.json build/
          cp nist_catalog_metadata.json build/

          (
            cd build
            zip -qr ../lambda-deployment.zip .
          )

          echo "Deployment package:"
          ls -lh lambda-deployment.zip

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy Lambda code
        shell: bash
        run: |
          set -euo pipefail

          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://lambda-deployment.zip \
            --region "$AWS_REGION"

          aws lambda wait function-updated-v2 \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --region "$AWS_REGION"

      - name: Verify deployed configuration
        shell: bash
        run: |
          set -euo pipefail

          aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --query '{
              FunctionName:FunctionName,
              Runtime:Runtime,
              Handler:Handler,
              LastModified:LastModified,
              State:State,
              LastUpdateStatus:LastUpdateStatus
            }'
